server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione Gzip per ottimizzare i tempi di caricamento
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Gestione del Routing Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Caching per file statici con Hash (JavaScript, CSS, Immagini, Font)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Disabilita il cache per index.html per garantire il recupero immediato di nuove release
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gestione pagine di errore
    error_page 500 502 503 504 /5x.x.html;
    location = /5x.x.html {
        root /usr/share/nginx/html;
    }
}